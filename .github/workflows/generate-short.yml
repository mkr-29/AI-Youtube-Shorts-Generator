name: Generate Short & Reel

on:
  schedule:
    # 09:00 UTC daily (2:30 PM IST)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to use (leave empty to let the AI pick one)"
        required: false
        type: string
      runs:
        description: "How many videos to generate"
        required: false
        default: "1"
        type: string
      voice:
        description: "edge-tts voice"
        required: false
        default: "en-US-ChristopherNeural"
        type: string
      upload_youtube:
        description: "Upload to YouTube Shorts"
        required: false
        default: true
        type: boolean
      upload_instagram:
        description: "Upload to Instagram Reels"
        required: false
        default: true
        type: boolean
      privacy:
        description: "Privacy status for YouTube uploads"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-freefont-ttf

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --check

      - name: Generate & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_RUNS: ${{ inputs.runs || '1' }}
          INPUT_VOICE: ${{ inputs.voice || 'en-US-ChristopherNeural' }}
          INPUT_UPLOAD_YT: ${{ inputs.upload_youtube ?? true }}
          INPUT_UPLOAD_IG: ${{ inputs.upload_instagram ?? true }}
          INPUT_PRIVACY: ${{ inputs.privacy || 'public' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          ARGS=(--runs "$INPUT_RUNS" --voice "$INPUT_VOICE" --lang "en")
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS+=(--topic "$INPUT_TOPIC")
          fi
          if [ "$INPUT_UPLOAD_YT" = "true" ]; then
            ARGS+=(--upload --privacy "$INPUT_PRIVACY")
          fi
          if [ "$INPUT_UPLOAD_IG" = "true" ]; then
            ARGS+=(--upload-instagram)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: assets/final/*.mp4
          if-no-files-found: warn
          retention-days: 14
